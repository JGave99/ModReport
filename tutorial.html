<title>Tutorial — ModReport</title>
<meta name="description" content="Come funziona ModReport in 7 passi: referto a blocchi, dettatura, schede, copia e stampa, libreria, importazione e team.">
<link rel="icon" href="assets/logo.svg" type="image/svg+xml">

<link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">

<body class="page-tutorial">

<header class="topbar">
  <a class="brand" href="index.html"><img src="assets/logo.svg" alt="" width="26" height="26"> ModReport</a>
  <div class="topbar__end">
    <a class="btn btn--ghost" id="back-link" href="index.html"><svg class="icon" aria-hidden="true"><use href="assets/icons.svg#arrow-left"></use></svg>Indietro</a>
    <a class="btn btn--primary" href="app.html">Apri l'editor</a>
  </div>
</header>

<main class="tut">
  <h1 class="page-title">Come funziona ModReport</h1>
  <p class="page-lead">Un giro guidato in 8 passi. Usa i comandi qui sotto o le frecce della tastiera.</p>
  <div class="player">
    <div class="stage" aria-hidden="true"><div id="mock"></div></div>
    <div class="prog" aria-hidden="true"><i id="bar"></i></div>
    <div class="cap" aria-live="polite"><div class="cap__n" id="cn"></div><h2 id="ct"></h2><p id="cp"></p></div>
    <div class="ctrl">
      <button class="btn btn--icon" id="prev" type="button" aria-label="Passo precedente"><svg class="icon" aria-hidden="true"><use href="assets/icons.svg#chevron-left"></use></svg></button>
      <button class="btn btn--primary" id="play" type="button"><svg class="icon" aria-hidden="true"><use href="assets/icons.svg#pause"></use></svg><span>Pausa</span></button>
      <button class="btn btn--icon" id="next" type="button" aria-label="Passo successivo"><svg class="icon" aria-hidden="true"><use href="assets/icons.svg#chevron-right"></use></svg></button>
      <div class="dots" id="dots" role="group" aria-label="Vai al passo"></div>
    </div>
  </div>
  <section class="news" id="novita" aria-labelledby="novita-title">
    <h2 class="news__title" id="novita-title"></h2>
    <div id="novita-body"></div>
  </section>
  <div class="tut-cta">
    <span>Pronto a provarlo?</span>
    <a class="btn btn--primary" href="app.html?view=signup">Crea un account gratuito</a>
    <a class="btn" href="app.html?local=1">Prova senza account</a>
  </div>
</main>

</body>
</html>
