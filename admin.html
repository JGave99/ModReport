<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self' https://umejthggxihtyqvcszgm.supabase.co wss://umejthggxihtyqvcszgm.supabase.co; frame-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; worker-src 'self' blob:; manifest-src 'self'">
<meta name="referrer" content="strict-origin-when-cross-origin">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Amministrazione — ModReport</title>
<link rel="icon" href="assets/logo.svg" type="image/svg+xml">
<link rel="icon" href="assets/icons/favicon-32.png" type="image/png" sizes="32x32">
<meta name="robots" content="noindex">
<script src="assets/vendor/supabase.js"></script>
<script src="js/config.js"></script>
<script type="module" src="js/pages/admin.js"></script>
<script src="js/theme.js"></script>
<link rel="stylesheet" href="css/fonts.css">
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/components.css">
<link rel="stylesheet" href="css/pages/archivio.css">
</head>
<body>

<div class="gate" id="gate">Verifica accesso in corso…</div>

<div id="page-root" class="hidden">
  <header class="topbar">
    <a class="brand" href="index.html"><img src="assets/logo.svg" alt="" width="26" height="26"> ModReport <small>Amministrazione</small></a>
    <nav class="topnav" aria-label="Sezioni">
      <a href="app.html"><svg class="icon" aria-hidden="true"><use href="assets/icons.svg#file-text"></use></svg><span>Referto</span></a>
    </nav>
  </header>

  <main class="page">
    <h1 class="page-title">Amministrazione</h1>
    <p class="page-lead">Richieste di verifica degli specializzandi e utenti registrati.</p>

    <div class="tabs" id="view-tabs">
      <button class="tab-btn active" data-view="requests"><svg class="icon" aria-hidden="true"><use href="assets/icons.svg#graduation-cap"></use></svg> Richieste specializzando</button>
      <button class="tab-btn" data-view="users"><svg class="icon" aria-hidden="true"><use href="assets/icons.svg#users"></use></svg> Utenti registrati</button>
    </div>

    <div id="view-requests">
      <div class="tabs">
        <button class="tab-btn active" data-filter="in_attesa">In attesa</button>
        <button class="tab-btn" data-filter="approvato">Approvate</button>
        <button class="tab-btn" data-filter="rifiutato">Rifiutate</button>
        <button class="tab-btn" data-filter="tutte">Tutte</button>
      </div>
      <div id="req-list"></div>
    </div>

    <div id="view-users" class="hidden">
      <div class="toolbar">
        <label class="visually-hidden" for="user-search">Cerca per email</label>
        <input type="text" class="input" id="user-search" placeholder="Cerca per email…">
      </div>
      <div id="users-count" class="muted" style="margin-bottom:10px;"></div>
      <div id="users-list"></div>
    </div>
  </main>
</div>

</body>
</html>
